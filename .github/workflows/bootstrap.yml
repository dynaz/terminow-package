# Builds the bootstrap archive and the package repository for the com.terminow package name
# from termux-packages, see scripts/terminow/.
#
# - The packages are published as a signed apt repository on the gh-pages branch, which must be
#   served by GitHub Pages at TERMINOW_REPO_BASE_URL of scripts/terminow/config.sh.
# - The bootstrap archive, proot loader and SHA-256 checksums are attached to a new release.
# - The bootstrap properties the app needs are exported as the release asset
#   terminow-bootstrap.properties. This repository never reads or writes the app source; the
#   app repository updates app/terminow-bootstrap.properties from that asset after verification.
#
# Requires the TERMINOW_REPO_GPG_PRIVATE_KEY repository secret, see scripts/terminow/generate-repo-key.sh.
name: TermiNow bootstrap

on:
  push:
    branches:
      - main
      # Isolated x86_64 staging validation only; never publishes to gh-pages (see the
      # staging-build-repo and staging-emulate jobs, which drop to contents: read).
      - x86_64-staging-validation
    paths:
      - 'scripts/terminow/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
    inputs:
      packages_ref:
        description: "termux-packages commit to build from, defaults to the one in scripts/terminow/config.sh"
        required: false
        default: ""
      extra_packages:
        description: "Comma separated packages to build in addition to the bootstrap ones, defaults to the ones in scripts/terminow/config.sh"
        required: false
        default: ""
      repo_packages:
        description: "Comma separated packages to build for the package repository only, defaults to the ones in scripts/terminow/config.sh"
        required: false
        default: ""
      architectures:
        description: "Comma separated architectures to build (aarch64,x86_64,arm,i686), defaults to the ones in scripts/terminow/config.sh"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: terminow-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    # The production build that force-pushes gh-pages and cuts a release. It must never run for the
    # staging branch, whose push only exercises the isolated staging jobs below.
    if: ${{ github.ref != 'refs/heads/x86_64-staging-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Empty values fall back to the defaults of scripts/terminow/config.sh (config.sh uses
      # ${VAR:=default}, so an empty value is treated the same as unset).
      TERMINOW_PACKAGES_REF: ${{ inputs.packages_ref }}
      TERMINOW_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
      TERMINOW_REPO_PACKAGES: ${{ inputs.repo_packages }}
      TERMINOW_ARCHITECTURES: ${{ inputs.architectures }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Check repository key
        env:
          TERMINOW_REPO_GPG_PRIVATE_KEY: ${{ secrets.TERMINOW_REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$TERMINOW_REPO_GPG_PRIVATE_KEY" ]; then
            echo "::error::The TERMINOW_REPO_GPG_PRIVATE_KEY secret is not set, see scripts/terminow/generate-repo-key.sh"
            exit 1
          fi
          printf '%s\n' "$TERMINOW_REPO_GPG_PRIVATE_KEY" | gpg --batch --quiet --import

      - name: Test repository scripts
        run: |
          sudo apt-get install -yq --no-install-recommends apt-utils gnupg xz-utils
          python3 -I scripts/terminow/tests/test_check_repo_deps.py
          python3 -I scripts/terminow/tests/test_prune_bootstrap.py
          python3 -I scripts/terminow/tests/test_check_bootstrap.py
          ./scripts/terminow/tests/test-make-apt-repo.sh

      - name: Build bootstrap and packages
        run: |
          [ -n "$TERMINOW_PACKAGES_REF" ] || unset TERMINOW_PACKAGES_REF
          [ -n "$TERMINOW_EXTRA_PACKAGES" ] || unset TERMINOW_EXTRA_PACKAGES
          [ -n "$TERMINOW_REPO_PACKAGES" ] || unset TERMINOW_REPO_PACKAGES
          . scripts/terminow/config.sh

          # Clone first to use its script for freeing the disk space needed by the build
          git init -q "$RUNNER_TEMP/work/termux-packages"
          git -C "$RUNNER_TEMP/work/termux-packages" remote add origin "$TERMINOW_PACKAGES_REPO"
          git -C "$RUNNER_TEMP/work/termux-packages" fetch -q --depth 1 origin "$TERMINOW_PACKAGES_REF"
          git -C "$RUNNER_TEMP/work/termux-packages" checkout -q FETCH_HEAD
          # free-space.sh frees ~36G for the build, but it also runs
          # `rm -rf /opt/runner-cache /opt/actionarchivecache`. On current GitHub runner
          # images (Node 20 was removed on 2026-09-23, so actions now run on the bundled
          # Node 24) the live runner's Node under
          # /home/runner/actions-runner/cached/<version>/externals/node24 is backed by
          # those caches, so removing them leaves the actions/checkout post-job credential
          # cleanup unable to start Node ("No such file or directory"). Keep those two
          # runner-owned caches (a few hundred MB) while still freeing everything else, so
          # the security cleanup still runs. See the build failure in run 41193611526.
          free_space="$RUNNER_TEMP/work/termux-packages/scripts/free-space.sh"
          sed -i -E 's@[[:space:]]+/opt/actionarchivecache@@g; s@[[:space:]]+/opt/runner-cache@@g' "$free_space"
          "$free_space"
          # python3 is used by the checks of the bootstrap and the repository, free-space.sh may remove it
          sudo apt-get install -yq --no-install-recommends jq apt-utils gnupg xz-utils python3

          ./scripts/terminow/build-bootstrap.sh "$RUNNER_TEMP/work"

          echo "TERMINOW_PACKAGES_REF=$TERMINOW_PACKAGES_REF" >> "$GITHUB_ENV"
          echo "TERMINOW_REPO_URL=$TERMINOW_REPO_URL" >> "$GITHUB_ENV"

      - name: Create package repository
        run: |
          . scripts/terminow/config.sh
          ./scripts/terminow/make-apt-repo.sh "$RUNNER_TEMP/work/termux-packages/output" "$RUNNER_TEMP/site/apt/terminow-main"
          # The bootstrap gets every package the build made, also ones that the repository leaves
          # out since they can never be installed, like dpkg-perl that needs clang. Leave them out
          # of the bootstrap too, so that apt works on a new install.
          for archive in "$RUNNER_TEMP"/work/termux-packages/output/bootstrap-*.zip; do
            arch="$(basename "$archive" .zip)"; arch="${arch#bootstrap-}"
            index="$(echo "$RUNNER_TEMP"/site/apt/terminow-main/dists/*/main/binary-"$arch"/Packages)"
            python3 -I scripts/terminow/prune-bootstrap.py "$archive" "$index" "/data/data/$TERMINOW_PACKAGE_NAME/files/usr" \
              --require apt bash coreutils dpkg termux-exec termux-tools termux-keyring
            python3 -I scripts/terminow/check-bootstrap.py "$archive" "$TERMINOW_PACKAGE_NAME"
          done
          # Like `pkg install` on a device, before the repository is published
          for arch in ${TERMINOW_ARCHITECTURES//,/ }; do
            ./scripts/terminow/test-repo-install.sh "$RUNNER_TEMP/site/apt/terminow-main" "$arch" ${TERMINOW_EXTRA_PACKAGES//,/ } ${TERMINOW_REPO_PACKAGES//,/ }
          done

      - name: Publish package repository
        run: |
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish package repository built from termux-packages $TERMINOW_PACKAGES_REF"
          # Every run builds all the packages, so the branch is replaced instead of growing with old packages
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Check published package repository
        run: |
          . scripts/terminow/config.sh
          # GitHub Pages serves the new branch after its deployment, which takes a few minutes
          for attempt in $(seq 1 30); do
            if curl -fsS "$TERMINOW_REPO_URL/dists/stable/InRelease" | grep -q "^Date: $(date -u -r "$RUNNER_TEMP/site/apt/terminow-main/dists/stable/Release" '+%a, %d %b %Y')"; then
              cmp <(curl -fsS "$TERMINOW_REPO_URL/dists/stable/InRelease") "$RUNNER_TEMP/site/apt/terminow-main/dists/stable/InRelease" && break
            fi
            sleep 20
          done
          cmp <(curl -fsS "$TERMINOW_REPO_URL/dists/stable/InRelease") "$RUNNER_TEMP/site/apt/terminow-main/dists/stable/InRelease"
          for arch in ${TERMINOW_ARCHITECTURES//,/ }; do
            ./scripts/terminow/test-repo-install.sh "$TERMINOW_REPO_URL" "$arch" ${TERMINOW_EXTRA_PACKAGES//,/ } ${TERMINOW_REPO_PACKAGES//,/ }
          done

      - name: Release bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/terminow/config.sh
          tag="terminow-bootstrap-$(date -u +%Y.%m.%d)-r${{ github.run_number }}"
          cd "$RUNNER_TEMP/work/termux-packages/output"
          shopt -s nullglob
          loaders=(proot-loader-*)
          sha256sum bootstrap-*.zip "${loaders[@]}" > bootstrap-sha256sums

          # The bootstrap properties the app consumes, published as a release asset instead of
          # editing the app source: the app repository is separate and private. After verifying
          # the release, copy these values into app/terminow-bootstrap.properties there.
          props="terminow-bootstrap.properties"
          {
            echo "# Generated by the TermiNow package build, release $tag."
            echo "# Copy these values into app/terminow-bootstrap.properties in the app repository."
            echo "architectures=${TERMINOW_ARCHITECTURES}"
          } > "$props"
          for archive in bootstrap-*.zip; do
            arch="${archive#bootstrap-}"; arch="${arch%.zip}"
            checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
            url="https://github.com/${{ github.repository }}/releases/download/$tag/bootstrap-$arch.zip"
            echo "url.$arch=$url" >> "$props"
            echo "sha256.$arch=$checksum" >> "$props"
            loader="proot-loader-$arch"
            loader_url=""; loader_checksum=""
            if [ -f "$loader" ]; then
              loader_url="https://github.com/${{ github.repository }}/releases/download/$tag/proot-loader-$arch"
              loader_checksum="$(sha256sum "$loader" | cut -d ' ' -f 1)"
            fi
            echo "proot-loader.url.$arch=$loader_url" >> "$props"
            echo "proot-loader.sha256.$arch=$loader_checksum" >> "$props"
          done

          gh release create "$tag" bootstrap-*.zip "${loaders[@]}" bootstrap-sha256sums "$props" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "TermiNow bootstrap $tag" \
            --notes "Bootstrap for com.terminow built from termux-packages ${TERMINOW_PACKAGES_REF}. Packages: ${TERMINOW_REPO_URL}. App repository: copy terminow-bootstrap.properties into app/terminow-bootstrap.properties."

          {
            echo "## Bootstrap release \`$tag\`"
            echo "APT repository: ${TERMINOW_REPO_URL}"
            echo '```properties'
            cat "$props"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =================================================================================================
  # Isolated x86_64 staging validation. Runs ONLY on the x86_64-staging-validation branch. It builds
  # a signed x86_64 apt repository and validates it on an x86_64 emulator, and it CANNOT touch
  # production: both jobs set permissions: contents: read (so they cannot push to gh-pages or create
  # a release), the repository is served only over the runner loopback to the test emulator, and the
  # production bootstrap job above is gated off for this branch. Production app sources and the
  # ARM64 production packages on gh-pages are left entirely unchanged.
  # =================================================================================================
  staging-build-repo:
    if: ${{ github.ref == 'refs/heads/x86_64-staging-validation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TERMINOW_ARCHITECTURES: x86_64
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Import repository signing key
        env:
          TERMINOW_REPO_GPG_PRIVATE_KEY: ${{ secrets.TERMINOW_REPO_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$TERMINOW_REPO_GPG_PRIVATE_KEY" ]; then
            echo "::error::The TERMINOW_REPO_GPG_PRIVATE_KEY secret is not set, see scripts/terminow/generate-repo-key.sh"
            exit 1
          fi
          printf '%s\n' "$TERMINOW_REPO_GPG_PRIVATE_KEY" | gpg --batch --quiet --import

      - name: Build the x86_64 bootstrap and repository packages
        run: |
          . scripts/terminow/config.sh
          git init -q "$RUNNER_TEMP/work/termux-packages"
          git -C "$RUNNER_TEMP/work/termux-packages" remote add origin "$TERMINOW_PACKAGES_REPO"
          git -C "$RUNNER_TEMP/work/termux-packages" fetch -q --depth 1 origin "$TERMINOW_PACKAGES_REF"
          git -C "$RUNNER_TEMP/work/termux-packages" checkout -q FETCH_HEAD
          # Keep the runner-owned Node caches so the post-job cleanup still runs, as the production
          # job does (see the comment there and run 41193611526).
          free_space="$RUNNER_TEMP/work/termux-packages/scripts/free-space.sh"
          sed -i -E 's@[[:space:]]+/opt/actionarchivecache@@g; s@[[:space:]]+/opt/runner-cache@@g' "$free_space"
          "$free_space"
          sudo apt-get install -yq --no-install-recommends jq apt-utils gnupg xz-utils python3
          ./scripts/terminow/build-bootstrap.sh "$RUNNER_TEMP/work"

      - name: Create and verify the signed x86_64 staging repository
        run: |
          . scripts/terminow/config.sh
          ./scripts/terminow/make-apt-repo.sh "$RUNNER_TEMP/work/termux-packages/output" "$RUNNER_TEMP/site/apt/terminow-main"
          release="$RUNNER_TEMP/site/apt/terminow-main/dists/stable/Release"
          inrelease="$RUNNER_TEMP/site/apt/terminow-main/dists/stable/InRelease"
          index="$RUNNER_TEMP/site/apt/terminow-main/dists/stable/main/binary-x86_64/Packages"
          echo "=== indexes present ==="
          ls -l "$index" "$index.gz" "$index.xz" "$release" "$inrelease" "$RUNNER_TEMP/site/apt/terminow-main/dists/stable/Release.gpg"
          echo "=== architecture line (must be x86_64, no aarch64) ==="
          grep -E '^(Architectures|Components|No-Support-for-Architecture-all):' "$release"
          echo "=== InRelease signature verifies against the repository key ==="
          gpg --verify "$inrelease"
          echo "=== required x86_64 packages are in the index with the right architecture ==="
          for p in proot proot-distro nodejs npm openssh; do
            awk -v p="$p" '$1=="Package:" && $2==p {pkg=1} pkg && $1=="Architecture:" {print p" -> "$2; pkg=0}' "$index"
          done
          for p in proot proot-distro nodejs npm; do
            grep -qE "^Package: $p$" "$index" || { echo "::error::$p is missing from the x86_64 index"; exit 1; }
          done
          echo "=== dependency availability: apt simulated install, with signature verification ==="
          ./scripts/terminow/test-repo-install.sh "$RUNNER_TEMP/site/apt/terminow-main" x86_64 proot proot-distro nodejs npm ${TERMINOW_EXTRA_PACKAGES//,/ }

      - name: Upload the staging repository for the emulator job
        uses: actions/upload-artifact@v6
        with:
          name: x86_64-staging-apt-repo
          path: ${{ runner.temp }}/site/apt
          if-no-files-found: error
          retention-days: 3

  staging-emulate:
    if: ${{ github.ref == 'refs/heads/x86_64-staging-validation' }}
    needs: staging-build-repo
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      STAGING_PORT: "8099"
    steps:
      - name: Verify runner KVM and enable access
        run: |
          if [ ! -e /dev/kvm ]; then echo "::error::/dev/kvm is absent"; exit 1; fi
          ls -la /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the staging repository
        uses: actions/download-artifact@v6
        with:
          name: x86_64-staging-apt-repo
          path: ${{ runner.temp }}/staging/apt

      - name: Serve the staging repository on the runner loopback
        run: |
          set -euo pipefail
          # The artifact was uploaded from <temp>/site/apt, so its contents are terminow-main/...
          # Locate the InRelease and serve its grandparent-of-dists so the apt base ends in /apt.
          inrelease="$(find "$RUNNER_TEMP/staging" -path '*/terminow-main/dists/stable/InRelease' | head -1)"
          if [ -z "$inrelease" ]; then
            echo "::error::staging InRelease not found in the downloaded artifact"; find "$RUNNER_TEMP/staging" | head -50; exit 1
          fi
          # .../<serve_root>/terminow-main/dists/stable/InRelease  ->  serve_root is 4 levels up
          serve_root="$(cd "$(dirname "$inrelease")/../../../.." && pwd)"
          echo "Serving $serve_root (so /terminow-main/... is reachable)"
          cd "$serve_root"
          nohup python3 -m http.server "$STAGING_PORT" --bind 0.0.0.0 > "$RUNNER_TEMP/staging-httpd.log" 2>&1 &
          base_path="${inrelease#$serve_root/}"; base_path="${base_path%/terminow-main/dists/stable/InRelease}"
          for i in $(seq 1 10); do
            curl -fsS "http://127.0.0.1:$STAGING_PORT/$base_path/terminow-main/dists/stable/InRelease" >/dev/null 2>&1 && break
            sleep 1
          done
          echo "--- staging InRelease head ---"
          curl -fsS "http://127.0.0.1:$STAGING_PORT/$base_path/terminow-main/dists/stable/InRelease" | head -8
          # base_path is normally "apt"; the runtime script swaps the production ".../apt" base for this.
          echo "TERMINOW_STAGING_BASE=http://10.0.2.2:$STAGING_PORT/$base_path" >> "$GITHUB_ENV"

      - name: Checkout the app
        uses: actions/checkout@v6
        with:
          repository: dynaz/termux-app
          ref: x86_64-bootstrap-enable

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the x86_64 debug APK
        run: |
          ./gradlew :app:assembleFullDebug
          APK="$(find app/build/outputs/apk -name '*_x86_64.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No x86_64 APK built. Built: $(find app/build/outputs/apk -name '*.apk')"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built $APK"

      - name: Run the hardened runtime checks against the staging repository
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            bash .github/scripts/x86_64_smoke.sh "$APK_PATH"
            # TERMINOW_STAGING_BASE points only this emulator's apt at the loopback staging repo.
            bash .github/scripts/x86_64_runtime.sh

      - name: Upload the staging runtime logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: x86_64-staging-runtime-logs
          path: |
            logcat.txt
            runtime.txt
            smoke-result.txt
            bash.bin
            ${{ runner.temp }}/staging-httpd.log
          if-no-files-found: ignore
